  :root { --bg:#14121f; --panel:#221d38; --line:#3d3560; --dark:#0e0c18; --text:#f0ecff; --dim:#a49cc8; --good:#90be6d; --bad:#f94144; --gold:#f9c74f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'SQDigits','Pixelify Sans',monospace; font-size:15px; min-height:100vh;
    background-image:linear-gradient(#ffffff07 2px,transparent 2px),linear-gradient(90deg,#ffffff07 2px,transparent 2px); background-size:16px 16px; }
  img, image { image-rendering:pixelated; }
  .wrap { max-width:560px; margin:0 auto; padding:14px 12px 40px; }
  h1 { padding-right:96px; font-family:'Press Start 2P',monospace; font-size:14px; margin:6px 0 10px; line-height:1.4; color:var(--gold); text-shadow:3px 3px 0 #000; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:12px; line-height:1.4; }
  .row { display:flex; gap:8px; }
  .card { flex:1; background:var(--panel); border:3px solid #0a0812; box-shadow:inset 0 0 0 2px var(--line); padding:6px 4px; text-align:center; min-width:0; }
  .card.dead { opacity:.4; }
  .card.dead img { filter:grayscale(1); }
  .choice { cursor:pointer; padding:8px 4px; }
  .choice.on { box-shadow:inset 0 0 0 3px var(--gold); background:#2d2650; }
  .fcard { display:flex; align-items:center; gap:10px; text-align:left; padding:8px 10px; }
  .fcard .info { flex:1; min-width:0; }
  .fcard.hit { animation:shake .3s steps(3); }
  @keyframes shake { 33% { transform:translateX(-5px); } 66% { transform:translateX(5px); } }
  .spr { display:block; margin:0 auto; width:64px; height:64px; flex:none; }
  .spr.sm { width:48px; height:48px; }
  .spr.mid { width:72px; height:72px; margin:0; }
  .spr.big { width:96px; height:96px; }
  .fcard .spr.big { margin:0; }
  .ico { width:16px; height:16px; vertical-align:-3px; }
  .bob { animation:bob 1s steps(2) infinite; }
  @keyframes bob { 50% { transform:translateY(-3px); } }
  .name { font-size:14px; font-weight:700; margin-top:2px; }
  .trait { font-size:12px; color:var(--dim); line-height:1.2; margin-top:4px; }
  .etag, .st { display:inline-block; font-family:'Press Start 2P',monospace; font-size:7px; padding:3px 4px; color:#1a1424; border:2px solid #000; vertical-align:middle; margin-top:3px; }
  .st { margin-right:3px; }
  .sts { min-height:16px; }
  .mtag { font-size:12px; color:var(--dim); }
  .mline { margin-bottom:6px; }
  .mline small { color:var(--dim); }
  .bar { height:10px; background:var(--dark); border:2px solid #000; margin-top:4px; }
  .ucard .bar i { transition:width .18s; }
  .bar > i { display:block; height:100%; background:var(--good); box-shadow:inset 0 -2px 0 #0004; }
  .bar.red > i { background:var(--bad); }
  .bar.sta { height:7px; margin-top:3px; }
  .bar.sta > i { background:#f9c74f; }
  .cost { color:#f9c74f; font-weight:700; }
  .ucard { padding:5px 3px; cursor:pointer; position:relative; }
  .ucard.sel { box-shadow:inset 0 0 0 3px var(--gold); }
  .ucard.planned { background:#2a2448; }
  .ucard.targetable { animation:blink .6s steps(2) infinite; }
  .ucard.hit { animation:shake .3s steps(3); }
  @keyframes blink { 50% { box-shadow:inset 0 0 0 3px #fff; } }
  .spr.xs { width:44px; height:44px; }
  .spr.bossimg { width:auto; height:128px; max-width:100%; object-fit:contain; margin:0 auto; display:block; image-rendering:auto; }
  .spr.bossbig { width:auto; height:200px; max-width:100%; object-fit:contain; image-rendering:auto; }
  .spr.tiny { width:32px; height:32px; display:inline-block; margin:0 8px 0 0; vertical-align:middle; }
  .nm { font-size:12px; font-weight:700; line-height:1.15; margin-top:2px; min-height:28px; }
  .lv { font-size:11px; color:var(--dim); }
  .lv .etag { margin-top:1px; }
  .plan { font-size:11px; color:var(--gold); margin-top:3px; line-height:1.15; }
  .ucard .hpt { font-size:11px; }
  .ucard .st { font-size:6px; padding:2px 3px; margin:1px; }
  .mini { padding:5px 3px; }
  .mini.empty { display:flex; align-items:center; justify-content:center; opacity:.5; }
  .faces.small { font-size:12px; padding:6px 8px; margin:6px 0; }
  .hint { font-size:14px; color:var(--dim); margin:4px 0 8px; text-align:center; }
  .hint b { color:var(--text); }
  h1 small { font-size:9px; color:var(--dim); text-shadow:none; }
  body { transition:background-color .4s steps(4); }
  .order { display:flex; gap:4px; flex-wrap:wrap; }
  .ord { width:40px; background:var(--panel); border:3px solid #000; text-align:center; font-size:10px; padding:2px 0; }
  .ord.foe { box-shadow:inset 0 -3px 0 var(--bad); }
  .ord.mine { box-shadow:inset 0 -3px 0 var(--good); }
  .ord.now { border-color:var(--gold); }
  .ord span { display:block; color:var(--dim); line-height:1; }
  .spr.ord-img { width:28px; height:28px; }
  .sndbar { position:fixed; top:8px; right:8px; z-index:50; display:flex; flex-direction:column; gap:4px; }
  .mute { flex:none; font-family:'Press Start 2P',monospace; font-size:8px; padding:6px 8px; background:#221d38; }
  .ucard { overflow:visible; }
  .ucard.acting { transform:translateY(-4px); }
  .ucard.ko-flash { animation:koflash .4s steps(4); }
  @keyframes koflash { 0%,50% { filter:brightness(3); } 100% { filter:none; } }
  .fx-box { position:absolute; left:50%; top:30px; width:0; height:0; pointer-events:none; z-index:5; }
  .fx-flash { position:absolute; left:-28px; top:-26px; width:56px; height:52px; opacity:.55; animation:fxflash .3s steps(3) forwards; }
  @keyframes fxflash { to { opacity:0; transform:scale(1.3); } }
  .fx-p { position:absolute; left:-3px; top:-3px; width:6px; height:6px; animation:fxfly .6s steps(6) forwards; }
  @keyframes fxfly { 0% { transform:translate(0,0); opacity:1; } 100% { transform:translate(var(--dx),var(--dy)); opacity:0; } }
  .fx-slash { position:absolute; left:-30px; top:-4px; width:60px; height:6px; background:#fff; box-shadow:0 0 0 2px #000; transform:rotate(-35deg) scaleX(0); animation:fxslash .3s steps(4) forwards; }
  @keyframes fxslash { 50% { transform:rotate(-35deg) scaleX(1); opacity:1; } 100% { transform:rotate(-35deg) scaleX(1.1); opacity:0; } }
  .fx-ring { position:absolute; left:-24px; top:-24px; width:48px; height:48px; border:4px solid #4cc9f0; border-radius:50%; animation:fxring .6s steps(5) forwards; }
  @keyframes fxring { 0% { transform:scale(.4); opacity:1; } 100% { transform:scale(1.4); opacity:0; } }
  .fx-num { position:absolute; top:22px; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:11px; text-shadow:2px 2px 0 #000, -1px -1px 0 #000; pointer-events:none; z-index:6; white-space:nowrap; animation:fxnum 1.05s steps(10) forwards; }
  .fx-num.big { font-size:15px; }
  .fx-num.tag { font-size:8px; top:40px; }
  @keyframes fxnum { 0% { transform:translate(-50%,6px); opacity:0; } 15% { transform:translate(-50%,0); opacity:1; } 75% { opacity:1; } 100% { transform:translate(-50%,-26px); opacity:0; } }
  .fx-name { position:absolute; left:50%; top:-14px; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:8px; color:#1a1424; padding:4px 6px; border:3px solid #000; white-space:nowrap; z-index:7; pointer-events:none; animation:fxname 1.05s steps(8) forwards; }
  @keyframes fxname { 0% { transform:translate(-50%,8px) scale(.6); opacity:0; } 15% { transform:translate(-50%,0) scale(1.1); opacity:1; } 25% { transform:translate(-50%,0) scale(1); } 80% { opacity:1; } 100% { transform:translate(-50%,-8px); opacity:0; } }
  .ls { font-size:13px; line-height:1.7; }
  .ls .lsl { display:inline-block; width:44px; font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold); }
  .ls.got { opacity:.55; }
  .ls.soon { color:#6f6896; }
  .gains { text-align:left; font-size:13px; line-height:1.4; margin:0 0 10px; }
  .gains div { display:flex; align-items:center; gap:2px; margin-bottom:4px; }
  .faces.newmove { border-color:var(--gold); }
  button.forget { background:#3a2f5e; }
  .autobar { margin-bottom:8px; }
  .autobar button { font-family:'Press Start 2P',monospace; font-size:9px; padding:9px 6px; background:#2d2650; }
  .autobar button.on { background:#90be6d; color:#1a1424; }
  .basicrow { display:grid; grid-template-columns:1fr; margin-top:8px; }
  .restbtn { display:block; width:100%; margin-top:8px; padding:14px 10px; background:var(--gold); color:#1a1424; font-family:'Press Start 2P',monospace; font-size:10px; }
  .restbtn:disabled { opacity:.45; }
  .statline { text-align:center; font-size:13px; color:var(--dim); margin-top:4px; }
  .hpt { font-size:12px; color:var(--dim); margin-top:2px; }
  .vs { text-align:center; font-family:'Press Start 2P',monospace; font-size:10px; color:var(--dim); margin:8px 0; }
  .section { margin:16px 0 6px; font-family:'Press Start 2P',monospace; font-size:9px; color:var(--dim); }
  button { font:inherit; font-weight:700; font-size:15px; border:3px solid #000; border-radius:0; padding:10px; background:#4a4080; color:var(--text); cursor:pointer; flex:1;
    box-shadow:inset -3px -3px 0 #00000066, inset 3px 3px 0 #ffffff22; }
  button:active { transform:translateY(2px); }
  button:disabled { cursor:default; }
  button.primary { background:var(--gold); color:#1a1424; }
  button.offer { text-align:left; display:flex; align-items:center; }
  button.offer small, .mvd { font-weight:400; color:#d6d0f5; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mv { text-align:left; position:relative; padding:8px; font-size:14px; }
  .mv:disabled { opacity:.6; }
  .mvd { font-size:12px; margin-top:4px; line-height:1.25; }
  .mvf { font-size:11px; margin-top:4px; color:#b9b0e6; font-weight:400; }
  .sup { color:#90be6d; font-weight:700; }
  .res { color:#ff8a8a; font-weight:700; }
  .cdov { position:absolute; inset:0; background:#0e0c18d0; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:9px; color:var(--dim); }
  .log { background:var(--dark); border:3px solid #000; padding:8px 10px; font-size:14px; line-height:1.4; min-height:100px; }
  .log div { color:var(--dim); }
  .log div:last-child { color:#fff; }
  .banner { text-align:center; padding:8px; }
  .banner h2 { font-family:'Press Start 2P',monospace; font-size:16px; margin:0 0 12px; color:var(--gold); text-shadow:3px 3px 0 #000; line-height:1.4; }
  .faces { background:var(--dark); border:3px solid #000; padding:8px 10px; font-size:14px; line-height:1.6; color:var(--dim); margin-bottom:10px; }
  .faces b { color:var(--text); }
  .map { width:100%; margin-top:10px; background:var(--dark); border:3px solid #000; }
  .n-off { fill:#221d38; stroke:#3d3560; stroke-width:3; }
  .n-done { fill:#2a2444; stroke:#5a5088; stroke-width:3; }
  .n-reach { fill:#3a3260; stroke:#f9c74f; stroke-width:3; animation:glow .6s steps(2) infinite; }
  .nclick { cursor:pointer; }
  @keyframes glow { 50% { stroke:#fff; } }

  /* ===== compact mobile layout ===== */
  .wrap { max-width:460px; padding:8px 8px 24px; }
  body { font-size:13px; }
  h1 { font-size:11px; margin:2px 0 6px; padding-right:66px; }
  h1 small { font-size:8px; }
  .sub { font-size:12px; margin-bottom:6px; line-height:1.3; }
  .section { margin:8px 0 4px; font-size:7px; }
  .row { gap:5px; }
  .card { padding:4px 3px; border-width:2px; }
  button { font-size:13px; padding:7px 6px; border-width:2px; }
  .spr { width:48px; height:48px; }
  .spr.mid { width:56px; height:56px; }
  .spr.big { width:72px; height:72px; }
  .spr.sm { width:36px; height:36px; }
  .spr.xs { width:32px; height:32px; }
  .spr.tiny { width:24px; height:24px; margin-right:6px; }
  .name { font-size:12px; }
  .trait { font-size:10px; line-height:1.15; }
  .hpt { font-size:10px; }
  .etag, .st { font-size:6px; padding:2px 3px; border-width:1px; }
  .faces { font-size:12px; padding:6px 8px; margin-bottom:6px; border-width:2px; }
  .mline { margin-bottom:4px; }
  details { margin-top:6px; }
  summary { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--dim); cursor:pointer; padding:6px 0; }
  .hero { display:flex; align-items:center; gap:8px; justify-content:center; }
  .hero .spr { margin:0; }
  .statline { font-size:11px; text-align:left; margin-top:2px; }
  .sndbar { top:4px; right:4px; flex-direction:row; gap:3px; }
  .mute { font-size:6px; padding:4px 4px; }
  .mute.off { opacity:.45; text-decoration:line-through; }
  .map { margin-top:6px; max-height:52vh; }
  .mini { padding:3px 2px; }
  .mini .nm { min-height:0; font-size:10px; }
  .mini .lv { font-size:9px; }
  .bar { height:7px; border-width:1px; margin-top:2px; }
  .bar.sta { height:4px; margin-top:1px; }
  .fcard { padding:5px 6px; gap:6px; }
  .banner { padding:2px 4px; }
  .banner h2 { font-size:12px; margin:0 0 6px; }
  .gains { font-size:11px; margin-bottom:6px; }
  .gains .gain { display:flex; align-items:center; gap:4px; margin-bottom:3px; line-height:1.25; }
  .gains small { color:var(--gold); }
  .gains .downed { color:#ff8a8a; font-size:10px; }
  .gains .gain > div { display:block; margin:0; }
  /* battle */
  .bhead { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:0 66px 4px 0; }
  .btitle { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--gold); line-height:1.3; }
  .autobar { display:flex; gap:3px; margin:0; flex:none; }
  .autobar button { font-size:7px; padding:5px 6px; flex:none; }
  .order { gap:2px; margin-bottom:4px; }
  .ord { width:26px; border-width:2px; padding:1px 0; font-size:8px; }
  .spr.ord-img { width:18px; height:18px; }
  .row.foes, .row.mine { margin-bottom:4px; }
  .ucard { padding:3px 2px 2px; }
  .ucard .spr { margin:0 auto; }
  .nm { font-size:9px; min-height:0; line-height:1.1; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lv { font-size:8px; line-height:1.1; }
  .ucard .hpt { font-size:8px; margin-top:1px; }
  .stv { color:#f9c74f; }
  .ucard .sts { min-height:13px; line-height:1; }
  .ucard .st { font-size:5px; padding:1px 2px; margin:1px 0 0; }
  .controls { margin-top:2px; }
  .hint { font-size:11px; margin:2px 0 4px; }
  .grid { gap:4px; grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .mv, .mv > div { min-width:0; }
  .mv { padding:5px 6px; font-size:12px; min-height:44px; }

<div class="sndbar"><button id="music" class="mute">MUSIC: ON</button><button id="mute" class="mute">SOUND: ON</button></div>
<div class="wrap" id="app"></div>
<script>
// On wide screens (PC), scale the game up to fill the window, but shrink it back so each screen fits
// the window height (little to no scrolling). Re-fits whenever the screen's content changes.
(function () {
  let raf = 0;
  function fit() {
    raf = 0;
    const w = innerWidth, h = innerHeight, el = document.getElementById('app'), bar = document.querySelector('.sndbar');
    if (w < 820) { el.style.zoom = 1; if (bar) bar.style.zoom = 1; return; }
    el.style.zoom = 1;
    const natural = el.scrollHeight;
    const z = Math.max(1, Math.min(w / 620, (h - 8) / natural, 2.4));
    el.style.zoom = z; if (bar) bar.style.zoom = Math.min(z, 1.6);
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(fit); };
  addEventListener('resize', queue);
  new MutationObserver(queue).observe(document.getElementById('app'), { childList:true, subtree:true });
  addEventListener('load', queue);
  queue();
})();
</script>
